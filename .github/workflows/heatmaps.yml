name: Update heatmaps

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - heatmaps/generate.py
      - .github/workflows/heatmaps.yml

permissions:
  contents: write

concurrency:
  group: heatmaps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        run: python heatmaps/generate.py

      # Runs even if one source failed, so the other card still gets updated.
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heatmaps/*.svg
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update Codewars and Kaggle heatmaps"
            git push
          fi
